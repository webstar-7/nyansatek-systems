<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Portal — NYANSATEK Systems</title>
<meta name="theme-color" content="#0D1320">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
body { background: var(--bg); }
.portal-wrap { max-width: 980px; margin: 0 auto; padding: 40px 20px 100px; }
.login-wrap { max-width: 400px; margin: 80px auto; }
.portal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
.portal-header h1 { font-size: 22px; }
.code-chip { font-family: var(--font-mono); font-weight: 700; color: var(--gold); background: var(--bg-card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; display: inline-block; }
.stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 28px; }
.stat-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 16px; }
.stat-card .label { font-size: 12px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; }
.stat-card .value { font-size: 24px; font-weight: 700; color: var(--text); margin-top: 4px; }
table.dash-table { width: 100%; border-collapse: collapse; background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
table.dash-table th { text-align: left; padding: 10px 12px; font-size: 12px; color: var(--text-faint); border-bottom: 1px solid var(--line); text-transform: uppercase; letter-spacing: 0.04em; }
table.dash-table td { padding: 10px 12px; font-size: 13.5px; border-bottom: 1px solid var(--line); color: var(--text-dim); }
table.dash-table tr:last-child td { border-bottom: none; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; }
.tag.unpaid { background: rgba(217,108,95,0.15); color: #F0A99C; }
.tag.paid { background: rgba(62,144,136,0.15); color: var(--teal); }
.tag.active { background: rgba(62,144,136,0.15); color: var(--teal); }
.tag.inactive { background: rgba(217,108,95,0.15); color: #F0A99C; }
.section-title { font-size: 16px; font-weight: 600; margin: 32px 0 12px; }
.section-title:first-of-type { margin-top: 0; }
.mini-btn { font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg-card); color: var(--text-dim); cursor: pointer; }
.mini-btn:hover { border-color: var(--gold); color: var(--gold); }
.copy-link { display: flex; gap: 8px; align-items: center; background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 24px; }
.copy-link input { flex: 1; background: none; border: none; color: var(--text-dim); font-family: var(--font-mono); font-size: 13px; }

/* ---- Portal tabs ---- */
.portal-tabs { display: flex; gap: 6px; margin-bottom: 26px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.portal-tab { position: relative; background: none; border: none; color: var(--text-dim); font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: 0.04em; padding: 12px 16px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; transition: color .2s; }
.portal-tab:hover { color: var(--text); }
.portal-tab::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--gold); transform: scaleX(0); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
.portal-tab.active { color: var(--text); }
.portal-tab.active::after { transform: scaleX(1); }
.portal-tab.res-tab { color: var(--gold); }
.portal-tab.res-tab .spark { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 0 rgba(227,165,76,.6); animation: spark 2s infinite; }
.portal-tab.res-tab.active::after { background: linear-gradient(90deg, var(--gold), var(--teal), var(--gold)); background-size: 200% 100%; animation: flow 3s linear infinite; }
@keyframes spark { 0% { box-shadow: 0 0 0 0 rgba(227,165,76,.6); } 70% { box-shadow: 0 0 0 9px rgba(227,165,76,0); } 100% { box-shadow: 0 0 0 0 rgba(227,165,76,0); } }
@keyframes flow { to { background-position: -200% 0; } }

/* ---- NYANSATEK RESOURCES panel ---- */
.res-panel { animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
.res-hero { position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); background: var(--bg-card); aspect-ratio: 1280 / 420; box-shadow: 0 20px 60px -30px rgba(227,165,76,.35); }
.res-hero video, .res-hero img { display: block; width: 100%; height: 100%; object-fit: cover; }
.res-cta-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 22px 0 28px; }
.res-cta-row p { color: var(--text-dim); font-size: 14px; max-width: 520px; margin: 0; }
.res-open { position: relative; display: inline-flex; align-items: center; gap: 10px; padding: 14px 24px; border-radius: 999px; background: linear-gradient(110deg, var(--gold) 0%, #F2C277 45%, var(--gold) 60%); background-size: 220% 100%; color: #0D1320; font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .03em; text-decoration: none; box-shadow: 0 8px 30px -8px rgba(227,165,76,.7); animation: shine 3.5s ease-in-out infinite; transition: transform .2s; }
.res-open:hover { transform: translateY(-2px) scale(1.02); }
.res-open svg { transition: transform .2s; }
.res-open:hover svg { transform: translateX(4px); }
@keyframes shine { 0%,100% { background-position: 100% 0; } 50% { background-position: 0 0; } }
.res-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.res-tool { display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: var(--radius-sm); background: var(--bg-card); border: 1px solid var(--line); color: var(--text); text-decoration: none; font-weight: 600; font-size: 14px; opacity: 0; animation: rise .5s cubic-bezier(.2,.8,.2,1) forwards; transition: border-color .2s, transform .2s, box-shadow .2s; }
.res-tool:hover { border-color: var(--gold); transform: translateY(-3px); box-shadow: 0 10px 30px -15px rgba(227,165,76,.6); }
.res-tool .ico { flex: 0 0 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: rgba(227,165,76,.12); color: var(--gold); }
.res-tool:nth-child(even) .ico { background: rgba(62,144,136,.15); color: var(--teal); }
.res-tool small { display: block; font-weight: 400; color: var(--text-faint); font-size: 12px; margin-top: 2px; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .res-panel, .res-tool, .res-open, .portal-tab.res-tab .spark, .portal-tab.res-tab.active::after { animation: none; opacity: 1; }
}
</style>
  <link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>

<div class="login-wrap" id="login-wrap">
  <div class="card" style="background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);padding:32px;">
    <h1 style="font-size:20px;margin-bottom:4px;">Team Portal</h1>
    <p style="color:var(--text-dim);font-size:13.5px;margin-bottom:20px;">Sign in with the email and password from your application.</p>
    <div id="login-error" class="status-msg error"></div>
    <form id="login-form">
      <div class="field"><label for="login-email">Email</label><input type="email" id="login-email" required></div>
      <div class="field"><label for="login-password">Password</label><input type="password" id="login-password" required></div>
      <button type="submit" class="btn btn-gold btn-block" id="login-submit">Sign In</button>
    </form>
  </div>
</div>

<div class="portal-wrap" id="portal-wrap" style="display:none;">
  <div class="portal-header">
    <div>
      <h1 id="welcome-name">—</h1>
      <span class="code-chip" id="welcome-code">—</span>
    </div>
    <button class="btn" style="background:var(--bg-card);border:1px solid var(--line);color:var(--text-dim);" onclick="logout()">Log Out</button>
  </div>
  <div class="portal-tabs" role="tablist">
    <button class="portal-tab active" role="tab" id="tab-dashboard" aria-selected="true" onclick="showTab('dashboard')">Dashboard</button>
    <button class="portal-tab res-tab" role="tab" id="tab-resources" aria-selected="false" onclick="showTab('resources')" style="display:none;"><span class="spark"></span>NYANSATEK RESOURCES</button>
  </div>
  <div id="dash-content" role="tabpanel"><div class="es">Loading...</div></div>
  <div id="res-content" role="tabpanel" style="display:none;"></div>
</div>

<script>
const SUPABASE_URL = "https://kqwqbohoeltlbwcopeug.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_T6oCd3aRO0OPheQXEkmvRA_nvIhEPcv";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const E = s => !s ? '' : String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const GH = n => 'GH\u20B5' + (n || 0).toFixed(2);
let accessToken = null;
let dashData = null;

async function callDash(endpoint, opts = {}) {
  const res = await fetch('/.netlify/functions/' + endpoint, {
    method: opts.method || 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + accessToken },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  return { ok: res.ok, data: await res.json() };
}

document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const errEl = document.getElementById('login-error');
  errEl.classList.remove('show');
  const btn = document.getElementById('login-submit');
  btn.disabled = true; btn.innerText = 'Signing in...';

  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;

  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      errEl.innerText = 'Email or password is incorrect.';
      errEl.classList.add('show');
      return;
    }
    accessToken = data.session.access_token;
    await loadDashboard();
  } catch (err) {
    errEl.innerText = 'Could not reach the server. Check your internet connection and try again.';
    errEl.classList.add('show');
  } finally {
    // always give the button back, whether sign-in worked, failed or the connection dropped
    resetLoginButton();
  }
});

function resetLoginButton() {
  const btn = document.getElementById('login-submit');
  btn.disabled = false; btn.innerText = 'Sign In';
}

async function logout() {
  try { await sb.auth.signOut(); } catch (e) { /* offline: still clear this screen */ }
  accessToken = null;
  dashData = null;
  resetResourcesTab();
  document.getElementById('dash-content').innerHTML = '<div class="es">Loading...</div>';
  document.getElementById('login-password').value = '';
  document.getElementById('login-error').classList.remove('show');
  resetLoginButton();
  document.getElementById('portal-wrap').style.display = 'none';
  document.getElementById('login-wrap').style.display = 'block';
}

async function loadDashboard() {
  const { ok, data } = await callDash('agent-dashboard');
  if (!ok || !data.ok) {
    document.getElementById('login-error').innerText = data.error || 'Could not load your dashboard.';
    document.getElementById('login-error').classList.add('show');
    return;
  }
  dashData = data;
  document.getElementById('login-password').value = '';
  document.getElementById('login-wrap').style.display = 'none';
  document.getElementById('portal-wrap').style.display = 'block';
  document.getElementById('welcome-name').innerText = data.agent.full_name;
  document.getElementById('welcome-code').innerText = data.agent.code;

  if (data.agent.role === 'sales_rep') renderRepDashboard(data);
  else if (data.agent.role === 'sales_manager') renderManagerDashboard(data);
  else renderFinanceDashboard(data); // accountant_hr and master share the base view

  loadResourcesTab();
}

/* ---------- NYANSATEK RESOURCES tab ----------
   Lives inside the portal, so it only shows once a team member has signed in. */
const RESOURCES_URL = 'https://webstar-7.github.io/resources/';
const RES_TOOLS = [
  { name: 'Passport Photos', note: 'Official-size ID photos', icon: '<rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8 7l1.6-2.5h4.8L16 7"/><circle cx="12" cy="13.5" r="3.6"/>' },
  { name: 'Full-Body Photos', note: 'Clean full-length shots', icon: '<circle cx="12" cy="5" r="2.6"/><path d="M12 8v7M8 11h8M12 15l-3 6M12 15l3 6"/>' },
  { name: 'Video Editor', note: 'Trim, cut and export', icon: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4.5-2.5z"/>' },
  { name: 'Graphic Design', note: 'Flyers, posts and more', icon: '<path d="M4 20l4-1L19 8l-3-3L5 16z"/><path d="M14 7l3 3"/>' },
  { name: 'Beat Making', note: 'Build tracks in the browser', icon: '<path d="M3 12h2l2-6 3 12 3-9 2 6 2-3h4"/>' },
  { name: 'PeopleDesk HR', note: 'Shared team records', icon: '<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.3"/><path d="M3.5 19c.8-3.4 3-5 5.5-5s4.7 1.6 5.5 5M15 14.2c2.4-.4 4.6.9 5.4 4.3"/>' },
];
const SVG = inner => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;

function loadResourcesTab() {
  renderResources(RESOURCES_URL);
  document.getElementById('tab-resources').style.display = 'inline-flex';
  if (location.hash === '#resources') showTab('resources');
}

function renderResources(url) {
  const safe = E(url);
  document.getElementById('res-content').innerHTML = `
    <div class="res-panel">
      <div class="res-hero">
        <video autoplay muted loop playsinline preload="auto" poster="assets/resources-banner-poster.jpg" aria-label="NYANSATEK Resources animated banner">
          <source src="assets/resources-banner.mp4" type="video/mp4">
        </video>
      </div>
      <div class="res-cta-row">
        <p>Your team toolkit — photo, video, design, music and HR tools in one place. Opens in a new tab.</p>
        <a class="res-open" href="${safe}" target="_blank" rel="noopener">
          Open NYANSATEK Resources
          ${SVG('<path d="M5 12h14M13 6l6 6-6 6"/>')}
        </a>
      </div>
      <div class="section-title">What's inside</div>
      <div class="res-grid">
        ${RES_TOOLS.map((t, i) => `
          <a class="res-tool" href="${safe}" target="_blank" rel="noopener" style="animation-delay:${0.08 * i + 0.15}s">
            <span class="ico">${SVG(t.icon)}</span>
            <span>${E(t.name)}<small>${E(t.note)}</small></span>
          </a>`).join('')}
      </div>
    </div>`;
}

function showTab(name) {
  const isRes = name === 'resources';
  document.getElementById('dash-content').style.display = isRes ? 'none' : 'block';
  document.getElementById('res-content').style.display = isRes ? 'block' : 'none';
  const tD = document.getElementById('tab-dashboard'), tR = document.getElementById('tab-resources');
  tD.classList.toggle('active', !isRes); tD.setAttribute('aria-selected', String(!isRes));
  tR.classList.toggle('active', isRes); tR.setAttribute('aria-selected', String(isRes));
  if (isRes) {
    const v = document.querySelector('#res-content video');
    if (v) v.play().catch(() => {});
  }
  history.replaceState(null, '', isRes ? '#resources' : location.pathname + location.search);
}

function resetResourcesTab() {
  document.getElementById('res-content').innerHTML = '';
  document.getElementById('tab-resources').style.display = 'none';
  showTab('dashboard');
}

function renderRepDashboard(data) {
  const c = document.getElementById('dash-content');
  c.innerHTML = `
    <div class="stat-cards">
      <div class="stat-card"><div class="label">Total earned</div><div class="value">${GH(data.total)}</div></div>
      <div class="stat-card"><div class="label">Unpaid</div><div class="value">${GH(data.unpaid)}</div></div>
      <div class="stat-card"><div class="label">Sales attributed</div><div class="value">${(data.commissions||[]).length}</div></div>
    </div>
    <div class="section-title">Your commission history</div>
    ${commissionTable(data.commissions, false)}
  `;
}

function renderManagerDashboard(data) {
  const c = document.getElementById('dash-content');
  const link = window.location.origin + '/careers.html?ref=' + encodeURIComponent(data.agent.code);
  c.innerHTML = `
    <div class="copy-link">
      <span style="font-size:12px;color:var(--text-faint);">Recruiting link:</span>
      <input type="text" readonly value="${E(link)}" id="recruit-link">
      <button class="mini-btn" onclick="copyRecruitLink()">Copy</button>
    </div>
    <div class="stat-cards">
      <div class="stat-card"><div class="label">Your override earnings</div><div class="value">${GH(data.ownTotal)}</div></div>
      <div class="stat-card"><div class="label">Team size</div><div class="value">${(data.team||[]).length}</div></div>
      <div class="stat-card"><div class="label">Team sales (all-time)</div><div class="value">${GH((data.team||[]).reduce((s,r)=>s+r.totalSales,0))}</div></div>
    </div>
    <div class="section-title">Your team</div>
    <table class="dash-table">
      <thead><tr><th>Name</th><th>Code</th><th>Sales</th><th>Their earnings</th><th>Status</th></tr></thead>
      <tbody>${(data.team||[]).length ? data.team.map(r => `
        <tr>
          <td>${E(r.full_name)}</td>
          <td style="font-family:var(--font-mono);">${E(r.code)}</td>
          <td>${r.saleCount} sale(s) \u2014 ${GH(r.totalSales)}</td>
          <td>${GH(r.totalCommission)}</td>
          <td><span class="tag ${r.is_active?'active':'inactive'}">${r.is_active?'Active':'Inactive'}</span></td>
        </tr>`).join('') : '<tr><td colspan="5" style="text-align:center;color:var(--text-faint);">No team members yet \u2014 share your recruiting link above.</td></tr>'}</tbody>
    </table>
    <div class="section-title">Your override commission history</div>
    ${commissionTable(data.ownCommissions, false)}
  `;
}

function renderFinanceDashboard(data) {
  const c = document.getElementById('dash-content');
  const isMaster = data.agent.role === 'master';
  c.innerHTML = `
    <div class="stat-cards">
      <div class="stat-card"><div class="label">Total unpaid</div><div class="value">${GH(data.totalOwed)}</div></div>
      <div class="stat-card"><div class="label">Total paid out</div><div class="value">${GH(data.totalPaid)}</div></div>
      <div class="stat-card"><div class="label">Total commission events</div><div class="value">${(data.allCommissions||[]).length}</div></div>
    </div>
    ${isMaster ? `
      <div class="section-title">Agents</div>
      <table class="dash-table">
        <thead><tr><th>Name</th><th>Code</th><th>Role</th><th>Region</th><th>Status</th><th></th></tr></thead>
        <tbody>${(data.allAgents||[]).map(a => `
          <tr>
            <td>${E(a.full_name)}</td>
            <td style="font-family:var(--font-mono);">${E(a.code)}</td>
            <td style="text-transform:capitalize;">${E((a.role||'').replace('_',' '))}</td>
            <td>${E(a.region||'\u2014')}</td>
            <td><span class="tag ${a.is_active?'active':'inactive'}">${a.is_active?'Active':'Inactive'}</span></td>
            <td><button class="mini-btn" onclick="toggleAgentStatus('${a.id}',${!a.is_active})">${a.is_active?'Deactivate':'Reactivate'}</button></td>
          </tr>`).join('')}</tbody>
      </table>
    ` : ''}
    <div class="section-title">All commissions</div>
    ${commissionTable(data.allCommissions, true)}
  `;
}

function commissionTable(rows, showMarkPaid) {
  if (!rows || !rows.length) return '<div class="es">No commission records yet.</div>';
  return `
    <table class="dash-table">
      <thead><tr>
        ${showMarkPaid ? '<th>Agent</th>' : ''}
        <th>Date</th><th>Product</th><th>Type</th><th>Sale amount</th><th>Commission</th><th>Status</th>${showMarkPaid?'<th></th>':''}
      </tr></thead>
      <tbody>${rows.map(r => `
        <tr>
          ${showMarkPaid ? `<td>${E(r.sales_agents?.full_name||'\u2014')} <span style="color:var(--text-faint);">(${E(r.sales_agents?.code||'')})</span></td>` : ''}
          <td>${new Date(r.created_at).toLocaleDateString()}</td>
          <td style="text-transform:uppercase;">${E(r.product)}</td>
          <td style="text-transform:capitalize;">${E((r.event_type||'').replace('_',' '))}</td>
          <td>${GH(r.amount_paid)}</td>
          <td>${GH(r.commission_amount)}</td>
          <td><span class="tag ${r.status}">${E(r.status)}</span></td>
          ${showMarkPaid ? `<td><button class="mini-btn" onclick="toggleCommissionPaid('${r.id}',${r.status!=='paid'})">${r.status==='paid'?'Mark unpaid':'Mark paid'}</button></td>` : ''}
        </tr>`).join('')}</tbody>
    </table>
  `;
}

function copyRecruitLink() {
  const input = document.getElementById('recruit-link');
  input.select();
  document.execCommand('copy');
}

async function toggleCommissionPaid(attributionId, paid) {
  const { ok, data } = await callDash('mark-commission-paid', { body: { attributionId, paid } });
  if (!ok || !data.ok) { alert(data.error || 'Could not update.'); return; }
  await loadDashboard();
}

async function toggleAgentStatus(agentId, isActive) {
  const { ok, data } = await callDash('set-agent-status', { body: { agentId, isActive } });
  if (!ok || !data.ok) { alert(data.error || 'Could not update.'); return; }
  await loadDashboard();
}

// If already signed in from a previous visit, skip straight to the dashboard.
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) { accessToken = session.access_token; await loadDashboard(); }
})();
</script>

<script>
/* NYANSATEK: Show/Hide button on every password field (including ones added later). */
(function () {
  if (window.__ntPw) return; window.__ntPw = 1;
  var css = document.createElement('style');
  css.textContent =
    '.ntpw-wrap{position:relative;display:block}.ntpw-wrap.ntpw-inline{display:inline-block;vertical-align:middle}' +
    '.ntpw-wrap>input{box-sizing:border-box}' +
    '.ntpw-btn{position:absolute;top:50%;right:6px;transform:translateY(-50%);margin:0;border:0;background:transparent;cursor:pointer;' +
    'font:700 12.5px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.02em;padding:0 8px;min-height:32px;min-width:44px;' +
    'border-radius:7px;opacity:.8;color:inherit;-webkit-tap-highlight-color:transparent}' +
    '.ntpw-btn:hover{opacity:1}.ntpw-btn:focus-visible{outline:2px solid currentColor;outline-offset:1px;opacity:1}' +
    '@media print{.ntpw-btn{display:none}}';
  (document.head || document.documentElement).appendChild(css);

  // does this field already have its own show/hide control next to it?
  function hasOwnToggle(inp) {
    var box = inp.parentElement;
    for (var depth = 0; box && depth < 2; depth++, box = box.parentElement) {
      if (depth > 0 && box.querySelectorAll('input').length > 1) break; // a box with other fields: their controls aren't ours
      var els = box.querySelectorAll('button,[role=button],span,i,a,svg,label');
      for (var i = 0; i < els.length; i++) {
        var b = els[i]; if (b === inp || b.contains(inp) || b.closest('.ntpw-wrap') || b.querySelector('.ntpw-btn')) continue;
        var txt = (b.textContent || '').trim(), oc = b.getAttribute('onclick') || '', al = b.getAttribute('aria-label') || '', cl = (b.getAttribute('class') || '') + ' ' + (b.id || '');
        if ((/^(show|hide)$/i.test(txt)) || /type|password|togglePw|showPw/i.test(oc) || /(show|hide) password/i.test(al) || /(^|[\s_-])(eye|pwt|pwtoggle|pw-toggle|toggle-pw|showpw|pass-toggle)/i.test(cl)) return true;
      }
    }
    return false;
  }

  function add(inp) {
    if (inp.dataset.ntpw) return; inp.dataset.ntpw = '1';
    if (hasOwnToggle(inp)) return;
    var cs = getComputedStyle(inp), wrap = document.createElement('span');
    wrap.className = 'ntpw-wrap';
    var parentW = inp.parentElement ? inp.parentElement.clientWidth : 0;
    var fullWidth = cs.display === 'block' || /100%/.test(inp.style.width) || (parentW && inp.offsetWidth >= parentW - 2);
    if (!fullWidth && inp.offsetWidth) { wrap.classList.add('ntpw-inline'); wrap.style.width = inp.offsetWidth + 'px'; }
    // keep the field's outside margins on the wrapper so the layout doesn't shift
    wrap.style.marginTop = cs.marginTop; wrap.style.marginBottom = cs.marginBottom; wrap.style.marginLeft = cs.marginLeft; wrap.style.marginRight = cs.marginRight;
    inp.parentNode.insertBefore(wrap, inp); wrap.appendChild(inp);
    inp.style.margin = '0'; if (!fullWidth && inp.offsetWidth) inp.style.width = '100%';
    var pr = parseFloat(cs.paddingRight) || 0; if (pr < 58) inp.style.paddingRight = '58px';
    var btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'ntpw-btn'; btn.textContent = 'Show';
    btn.setAttribute('aria-label', 'Show password'); btn.setAttribute('aria-pressed', 'false');
    btn.style.color = cs.color;
    btn.addEventListener('mousedown', function (e) { e.preventDefault(); }); // keep focus and the keyboard in the field
    btn.addEventListener('click', function () {
      var show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      btn.textContent = show ? 'Hide' : 'Show';
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      btn.setAttribute('aria-pressed', String(show));
    });
    wrap.appendChild(btn);
  }
  function hideAll(root) {
    var list = (root || document).querySelectorAll('input[data-ntpw]');
    for (var i = 0; i < list.length; i++) {
      var inp = list[i]; if (inp.type !== 'text') continue;
      var b = inp.parentElement && inp.parentElement.querySelector('.ntpw-btn');
      if (b) { inp.type = 'password'; b.textContent = 'Show'; b.setAttribute('aria-label', 'Show password'); b.setAttribute('aria-pressed', 'false'); }
    }
  }
  function scan(root) {
    var list = (root.querySelectorAll ? root : document).querySelectorAll('input[type=password]:not([data-ntpw])');
    for (var i = 0; i < list.length; i++) add(list[i]);
  }
  // before any form is sent, hide passwords again (some apps check the field type, and browsers only offer to save hidden passwords)
  document.addEventListener('submit', function (e) { hideAll(e.target); }, true);
  document.addEventListener('click', function (e) { var t = e.target.closest && e.target.closest('button[type=submit],input[type=submit]'); if (t && t.form) hideAll(t.form); }, true);
  var start = function () {
    scan(document);
    new MutationObserver(function (ms) {
      for (var i = 0; i < ms.length; i++) {
        var m = ms[i];
        if (m.type === 'attributes') { if (m.target.type === 'password' && !m.target.dataset.ntpw) add(m.target); continue; }
        for (var j = 0; j < m.addedNodes.length; j++) { var n = m.addedNodes[j]; if (n.nodeType === 1) { if (n.matches && n.matches('input[type=password]')) add(n); else scan(n); } }
      }
    }).observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['type'] });
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
